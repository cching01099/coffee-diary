version: 2
updates:
  # npm dependencies (package.json / package-lock.json at the repo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch bumps into one PR instead of one per package
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keep the GitHub Actions used in .github/workflows up to date too
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
